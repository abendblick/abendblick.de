<!doctype html>
<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- HTML Meta Tags -->
    <title>Abendblick</title>

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://abendblick.de" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./assets/logo.png" />
    <meta property="og:title" content="Abendblick-Musik" />

      property="og:description"
      content="Die Website der Abendblick-Musik Veranstaltung im gemütlichen Taranta Babu"

    <style>
      html,

        height: 100%;

      body {
        display: grid;
        grid: "
        'background' min-content
        'header' min-content
        'main' min-content
        'footer' min-content
        / 1fr";
      }
      a {
        text-decoration: underline;
        color: rgb(234 179 8);
      }

      main img {
        border-radius: 4px;
        width: 100%;
        aspect-ratio: 1/1;
        object-fit: cover;
      }
    </style>
